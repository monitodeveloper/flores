<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Un universo para ti 🌻</title>

    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {

            position: relative;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                radial-gradient(
                    ellipse at center,
                    #241b08 0%,
                    #100d07 30%,
                    #050504 65%,
                    #000000 100%
                );

            color: white;
        }


        /* =====================================================
           FONDO DORADO
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    circle at 50% 48%,
                    rgba(255, 193, 7, .14),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 20% 80%,
                    rgba(255, 170, 0, .07),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 20%,
                    rgba(255, 210, 50, .06),
                    transparent 35%
                );

            z-index: 0;
        }


        /* =====================================================
           ESTRELLAS
        ===================================================== */

        #stars {

            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;
        }

        .star {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #fffdf0;

            box-shadow:
                0 0 5px #fff,
                0 0 12px rgba(255, 230, 120, .8);

            animation:
                twinkle var(--duration)
                ease-in-out infinite;
        }

        @keyframes twinkle {

            0% {
                opacity: .15;
                transform: scale(.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.6);
            }

            100% {
                opacity: .15;
                transform: scale(.5);
            }
        }


        /* =====================================================
           NEBULOSAS
        ===================================================== */

        .nebula {

            position: fixed;

            width: 650px;
            height: 650px;

            border-radius: 50%;

            filter: blur(120px);

            pointer-events: none;

            z-index: 0;
        }

        .nebula.one {

            background: #ffd000;

            left: 50%;
            top: 45%;

            transform:
                translate(-50%, -50%);

            opacity: .13;
        }

        .nebula.two {

            background: #ff9d00;

            left: -300px;
            top: 10%;

            opacity: .08;
        }

        .nebula.three {

            background: #d88a00;

            right: -300px;
            bottom: -200px;

            opacity: .08;
        }


        /* =====================================================
           SOL CENTRAL
        ===================================================== */

        .sun-core {

            position: fixed;

            width: 210px;
            height: 210px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #fffde7 0%,
                    #fff176 16%,
                    #ffd600 38%,
                    #ffb300 55%,
                    rgba(255,179,0,.18) 70%,
                    transparent 72%
                );

            box-shadow:

                0 0 30px #ffd600,

                0 0 80px
                rgba(255,193,7,.7),

                0 0 170px
                rgba(255,193,7,.35);

            z-index: 3;

            opacity: 0;

            transition:
                opacity 3s ease;
        }

        .sun-core.active {

            opacity: 1;

            animation:
                sunPulse 5s ease-in-out infinite;
        }

        @keyframes sunPulse {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(.96);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.05);

            }
        }


        /* =====================================================
           ANILLOS
        ===================================================== */

        .ring {

            position: fixed;

            left: 50%;
            top: 50%;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 214, 0, .18);

            transform:
                translate(-50%, -50%)
                rotateX(70deg);

            pointer-events: none;

            z-index: 2;

            opacity: 0;

            transition:
                opacity 3s ease;
        }

        .ring.active {
            opacity: 1;
        }

        .ring.one {

            width: 560px;
            height: 560px;

            animation:
                ringRotate 20s linear infinite;
        }

        .ring.two {

            width: 820px;
            height: 820px;

            animation:
                ringRotate 34s linear infinite reverse;
        }

        @keyframes ringRotate {

            from {

                transform:
                    translate(-50%, -50%)
                    rotateX(70deg)
                    rotateZ(0deg);
            }

            to {

                transform:
                    translate(-50%, -50%)
                    rotateX(70deg)
                    rotateZ(360deg);
            }
        }


        /* =====================================================
           UNIVERSO DE FLORES
        ===================================================== */

        #flowerUniverse {

            position: fixed;

            inset: 0;

            z-index: 8;

            perspective: 1000px;

            pointer-events: none;
        }


        /* =====================================================
           GIRASOLES
        ===================================================== */

        .sunflower {

            position: absolute;

            width: var(--size);
            height: var(--size);

            left: var(--x);
            top: var(--y);

            transform:

                translate(-50%, -50%)

                translateZ(var(--depth))

                rotate(var(--rotation))

                scale(var(--scale));

            opacity: 0;

            transition:
                opacity 2s ease;

            filter:

                drop-shadow(
                    0 0 8px
                    rgba(255,193,7,.8)
                )

                drop-shadow(
                    0 0 25px
                    rgba(255,193,7,.3)
                );

            animation:

                floating
                var(--float-time)
                ease-in-out
                infinite alternate;
        }

        .sunflower.visible {
            opacity: 1;
        }


        /* =====================================================
           PÉTALOS
        ===================================================== */

        .petals {

            position: absolute;

            width: 100%;
            height: 100%;

            animation:
                flowerSpin 30s linear infinite;
        }

        .petal {

            position: absolute;

            width: 24%;
            height: 45%;

            left: 38%;
            top: 5%;

            border-radius:
                50%
                50%
                45%
                45%;

            background:

                radial-gradient(
                    ellipse at 50% 30%,
                    #fffde0 0%,
                    #fff176 12%,
                    #ffd600 40%,
                    #ffb300 72%,
                    #ef7d00 100%
                );

            transform-origin:
                50% 100%;

            box-shadow:
                0 0 6px
                rgba(255,193,7,.7);
        }

        .petal:nth-child(1) {
            transform: rotate(0deg);
        }

        .petal:nth-child(2) {
            transform: rotate(30deg);
        }

        .petal:nth-child(3) {
            transform: rotate(60deg);
        }

        .petal:nth-child(4) {
            transform: rotate(90deg);
        }

        .petal:nth-child(5) {
            transform: rotate(120deg);
        }

        .petal:nth-child(6) {
            transform: rotate(150deg);
        }

        .petal:nth-child(7) {
            transform: rotate(180deg);
        }

        .petal:nth-child(8) {
            transform: rotate(210deg);
        }

        .petal:nth-child(9) {
            transform: rotate(240deg);
        }

        .petal:nth-child(10) {
            transform: rotate(270deg);
        }

        .petal:nth-child(11) {
            transform: rotate(300deg);
        }

        .petal:nth-child(12) {
            transform: rotate(330deg);
        }


        /* =====================================================
           CENTRO
        ===================================================== */

        .flower-center {

            position: absolute;

            width: 38%;
            height: 38%;

            left: 31%;
            top: 31%;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 40% 35%,
                    #a96f18,
                    #593509 45%,
                    #211204 100%
                );

            box-shadow:

                inset 0 0 15px #130900,

                0 0 7px
                rgba(255,193,7,.6);

            z-index: 10;
        }

        .flower-center::after {

            content: "";

            position: absolute;

            inset: 15%;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #e0a82e 0 2px,
                    transparent 3px
                );

            background-size:
                9px 9px;

            opacity: .65;
        }


        @keyframes flowerSpin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }


        @keyframes floating {

            0% {
                margin-top: -10px;
            }

            100% {
                margin-top: 10px;
            }
        }


        /* =====================================================
           MENSAJE PRINCIPAL
        ===================================================== */

        .message {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -46%)
                scale(.96);

            width:
                min(720px, 90%);

            text-align: center;

            z-index: 50;

            opacity: 0;

            pointer-events: none;

            transition:

                opacity 2.5s ease,

                transform 2.5s
                cubic-bezier(.22,1,.36,1);
        }

        .message.active {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        /* =====================================================
           PEQUEÑA FRASE SUPERIOR
        ===================================================== */

        .message .eyebrow {

            font-family:
                Arial,
                sans-serif;

            font-size:
                clamp(.65rem, 1.5vw, .85rem);

            letter-spacing:
                .45em;

            text-transform:
                uppercase;

            color:
                rgba(255,230,150,.85);

            margin-bottom:
                18px;

            opacity: 0;

            transform:
                translateY(15px);

            transition:
                all 1.5s ease .3s;
        }

        .message.active .eyebrow {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        .message h1 {

            font-size:
                clamp(
                    2.3rem,
                    7vw,
                    5.5rem
                );

            font-weight:
                normal;

            color:
                #fff8d0;

            line-height:
                1.02;

            letter-spacing:
                -.025em;

            text-shadow:

                0 0 8px
                rgba(255,255,220,.9),

                0 0 25px
                rgba(255,193,7,.8),

                0 0 60px
                rgba(255,152,0,.5);

            opacity: 0;

            transform:
                translateY(25px);

            transition:
                all 1.8s
                cubic-bezier(.22,1,.36,1)
                .6s;
        }

        .message.active h1 {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           LÍNEA DECORATIVA
        ===================================================== */

        .ornament {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin:
                25px auto 22px;

            width:
                min(330px, 70%);

            opacity: 0;

            transition:
                opacity 1.5s ease 1s;
        }

        .message.active .ornament {
            opacity: 1;
        }

        .ornament span {

            height: 1px;

            flex: 1;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(255,210,70,.8),
                    transparent
                );
        }

        .ornament i {

            font-style: normal;

            color:
                #ffd54f;

            font-size:
                1rem;

            text-shadow:
                0 0 10px #ffc107;
        }


        /* =====================================================
           FRASE
        ===================================================== */

        .message .love-text {

            margin-top: 0;

            font-size:
                clamp(
                    1.05rem,
                    2.4vw,
                    1.5rem
                );

            line-height:
                1.8;

            font-style:
                italic;

            color:
                rgba(255,255,255,.94);

            text-shadow:

                0 0 8px
                rgba(0,0,0,.9),

                0 0 20px
                rgba(255,193,7,.25);

            opacity: 0;

            transform:
                translateY(20px);

            transition:
                all 1.8s
                cubic-bezier(.22,1,.36,1)
                1.2s;
        }

        .message.active .love-text {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           FIRMA
        ===================================================== */

        .signature {

            margin-top:
                22px;

            font-family:
                "Brush Script MT",
                "Segoe Script",
                cursive;

            font-size:
                clamp(
                    1.3rem,
                    3vw,
                    1.8rem
                );

            color:
                #ffd95a;

            text-shadow:
                0 0 12px
                rgba(255,193,7,.6);

            opacity: 0;

            transform:
                translateY(15px);

            transition:
                all 1.5s ease 1.7s;
        }

        .message.active .signature {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* =====================================================
           BOTÓN
        ===================================================== */

        #startButton {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            z-index: 100;

            padding:
                18px 38px;

            border:
                1px solid
                rgba(255,235,150,.65);

            border-radius:
                50px;

            font-family:
                Georgia,
                serif;

            font-size:
                1.05rem;

            letter-spacing:
                .04em;

            color:
                #3d2800;

            background:

                linear-gradient(
                    135deg,
                    #fff8a8,
                    #ffd83d,
                    #ffb300
                );

            cursor:
                pointer;

            box-shadow:

                0 0 20px
                rgba(255,214,0,.7),

                0 0 60px
                rgba(255,193,7,.35);

            transition:
                all .5s
                cubic-bezier(.22,1,.36,1);
        }

        #startButton:hover {

            transform:
                translate(-50%, -50%)
                scale(1.07);

            box-shadow:

                0 0 30px
                #fff176,

                0 0 90px
                rgba(255,193,7,.7);
        }

        #startButton.hide {

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(1.8);

            pointer-events:
                none;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width:600px) {

            .sun-core {

                width:
                    140px;

                height:
                    140px;
            }

            .ring.one {

                width:
                    360px;

                height:
                    360px;
            }

            .ring.two {

                width:
                    520px;

                height:
                    520px;
            }

            .message {

                width:
                    88%;
            }

            .message .eyebrow {

                letter-spacing:
                    .28em;
            }

            .message h1 {

                font-size:
                    clamp(
                        2.3rem,
                        12vw,
                        4rem
                    );
            }

            .message .love-text {

                font-size:
                    1.05rem;

                line-height:
                    1.7;
            }

            #startButton {

                width:
                    82%;

                padding:
                    17px 18px;

                font-size:
                    1rem;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         FONDO
    ===================================================== -->

    <div class="nebula one"></div>
    <div class="nebula two"></div>
    <div class="nebula three"></div>

    <div id="stars"></div>


    <!-- =====================================================
         ANILLOS
    ===================================================== -->

    <div class="ring one"></div>

    <div class="ring two"></div>


    <!-- =====================================================
         SOL
    ===================================================== -->

    <div class="sun-core"></div>


    <!-- =====================================================
         FLORES
    ===================================================== -->

    <div id="flowerUniverse"></div>


    <!-- =====================================================
         MENSAJE
    ===================================================== -->

    <div
        class="message"
        id="message"
    >

        <div class="eyebrow">
            ✦ PARA TI ✦
        </div>


        <h1>
            Feliz día de las<br>
            flores amarillas        
        </h1>


        <div class="ornament">

            <span></span>

            <i>✦</i>

            <span></span>

        </div>


        <p class="love-text">

            Amarillas como el sol,<br>

            porque tú tienes esa forma<br>

            de iluminar mis días milagros. ✨

        </p>


        <div class="signature">
            Con cariño, para ti ♡
        </div>

    </div>


    <!-- =====================================================
         BOTÓN
    ===================================================== -->

    <button id="startButton">

        &nbsp; Abre tú universo corazón &nbsp;

    </button>


    <!-- =====================================================
         MÚSICA
    ===================================================== -->

    <audio
        id="music"
        preload="auto"
        loop
    >

        <source
            src="./floricienta.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const stars =
            document.getElementById("stars");

        const universe =
            document.getElementById(
                "flowerUniverse"
            );

        const button =
            document.getElementById(
                "startButton"
            );

        const message =
            document.getElementById(
                "message"
            );

        const sun =
            document.querySelector(
                ".sun-core"
            );

        const rings =
            document.querySelectorAll(
                ".ring"
            );

        const music =
            document.getElementById(
                "music"
            );


        /* =====================================================
           ESTRELLAS
        ===================================================== */

        function createStars() {

            for (
                let i = 0;
                i < 280;
                i++
            ) {

                const star =
                    document.createElement(
                        "div"
                    );

                star.className =
                    "star";

                const size =
                    Math.random() * 2.8 + .5;

                star.style.width =
                    size + "px";

                star.style.height =
                    size + "px";

                star.style.left =
                    Math.random() * 100 + "vw";

                star.style.top =
                    Math.random() * 100 + "vh";

                star.style.setProperty(
                    "--duration",
                    (
                        Math.random() * 4 + 2
                    ) + "s"
                );

                stars.appendChild(
                    star
                );
            }
        }


        /* =====================================================
           CREAR GIRASOL
        ===================================================== */

        function createSunflower(
            x,
            y,
            size,
            scale,
            depth,
            rotation,
            delay
        ) {

            const flower =
                document.createElement(
                    "div"
                );

            flower.className =
                "sunflower";


            flower.style.setProperty(
                "--x",
                x + "%"
            );

            flower.style.setProperty(
                "--y",
                y + "%"
            );

            flower.style.setProperty(
                "--size",
                size + "px"
            );

            flower.style.setProperty(
                "--scale",
                scale
            );

            flower.style.setProperty(
                "--depth",
                depth + "px"
            );

            flower.style.setProperty(
                "--rotation",
                rotation + "deg"
            );

            flower.style.setProperty(
                "--float-time",
                (
                    Math.random() * 4 + 3
                ) + "s"
            );


            const petals =
                document.createElement(
                    "div"
                );

            petals.className =
                "petals";


            for (
                let i = 0;
                i < 12;
                i++
            ) {

                const petal =
                    document.createElement(
                        "div"
                    );

                petal.className =
                    "petal";

                petals.appendChild(
                    petal
                );
            }


            const center =
                document.createElement(
                    "div"
                );

            center.className =
                "flower-center";


            flower.appendChild(
                petals
            );

            flower.appendChild(
                center
            );

            universe.appendChild(
                flower
            );


            setTimeout(
                () => {

                    flower.classList.add(
                        "visible"
                    );

                },
                delay
            );
        }


        /* =====================================================
           CREAR UNIVERSO
        ===================================================== */

        function createUniverse() {


            /* FLORES PEQUEÑAS */

            for (
                let i = 0;
                i < 65;
                i++
            ) {

                createSunflower(

                    Math.random() * 120 - 10,

                    Math.random() * 100,

                    Math.random() * 30 + 22,

                    Math.random() * .6 + .35,

                    -300,

                    Math.random() * 360,

                    Math.random() * 2500

                );
            }


            /* FLORES MEDIANAS */

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                createSunflower(

                    Math.random() * 115 - 7,

                    Math.random() * 100,

                    Math.random() * 45 + 40,

                    Math.random() * .5 + .7,

                    -100,

                    Math.random() * 360,

                    Math.random() * 3000

                );
            }


            /* FLORES GRANDES */

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                createSunflower(

                    Math.random() * 120 - 10,

                    Math.random() * 115 - 5,

                    Math.random() * 80 + 75,

                    Math.random() * .5 + 1,

                    100,

                    Math.random() * 360,

                    Math.random() * 4000

                );
            }

        }


        /* =====================================================
           INICIAR ESTRELLAS
        ===================================================== */

        createStars();


        /* =====================================================
           BOTÓN
        ===================================================== */

        button.addEventListener(
            "click",
            function () {


                /* Ocultar botón */

                button.classList.add(
                    "hide"
                );


                /* Encender sol */

                sun.classList.add(
                    "active"
                );


                /* Activar anillos */

                rings.forEach(
                    function (ring) {

                        ring.classList.add(
                            "active"
                        );

                    }
                );


                /* Crear universo */

                createUniverse();


                /* Mostrar mensaje */

                setTimeout(
                    function () {

                        message.classList.add(
                            "active"
                        );

                    },
                    1800
                );


                /* =================================================
                   MÚSICA
                ================================================= */

                music.volume = 1;

                music.currentTime = 0;

                music.play()
                    .then(
                        function () {

                            console.log(
                                "🎵 Música reproduciéndose"
                            );

                        }
                    )
                    .catch(
                        function (error) {

                            console.error(
                                "Error de audio:",
                                error
                            );

                        }
                    );

            }
        );

    </script>

</body>

</html>


</body>

</html>
